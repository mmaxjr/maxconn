[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxconn"
version = "0.1.14"
description = "Python toolkit for network and infrastructure automation, starting with raw-socket SSH and Telnet."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Marcos Max" },
]
keywords = [
    "automation",
    "devops",
    "infrastructure",
    "network",
    "ssh",
    "telnet",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
maxconn = "maxconn.cli:main"

[project.urls]
Changelog = "https://github.com/mmaxjr/maxconn/blob/main/CHANGELOG.md"
Homepage = "https://github.com/mmaxjr/maxconn"
Repository = "https://github.com/mmaxjr/maxconn"
Issues = "https://github.com/mmaxjr/maxconn/issues"

[project.optional-dependencies]
ssh = [
    "cryptography>=42",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.6",
    "twine>=5.0",
    "tomli>=2; python_version < '3.11'",
    "cryptography>=42",
    # paramiko is a TEST-ONLY dependency: it powers a local SSH server used
    # only by tests/integration/ssh_server.py to validate our from-scratch
    # SSHTransport against a real, independent SSH implementation. It is
    # never imported by maxconn itself.
    "paramiko>=3.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/maxconn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# PYI034: `Self` requires Python 3.11+; this project supports 3.10+.
ignore = ["PYI034"]
