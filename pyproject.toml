[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maxconn"
version = "0.1.0"
description = "SSH and Telnet client implemented from scratch, without paramiko/netmiko/scrapli/telnetlib."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/maxconn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
